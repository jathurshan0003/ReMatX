version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rematx-postgres
    restart: always
    environment:
      POSTGRES_USER: rematx_user
      POSTGRES_PASSWORD: rematx_secure_password
      POSTGRES_DB: rematx_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
